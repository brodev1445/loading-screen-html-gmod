    <style>
        /* Réinitialisation et base pour Garry's Mod */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
            /* Ciel bleu nuit électrique et saturé */
            background: linear-gradient(180deg, #0b1956 0%, #163399 48%, #2657d4 100%);
            color: #ffffff;
        }

        .font-cartoon-title {
            font-family: 'Titan One', 'Fredoka', cursive, sans-serif;
        }

        .font-mono-cartoon {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Titre cartoon épais avec contour sombre franc et ombre portée 2D */
        .cartoon-title-text {
            color: #ffffff;
            -webkit-text-stroke: 3px #09112e;
            paint-order: stroke fill;
            text-shadow: 0 6px 0 #09112e, 0 10px 20px rgba(9, 17, 46, 0.55);
        }

        /* Petit contour cartoon pour les textes de statut */
        .cartoon-text-outline {
            text-shadow:
                -1.5px -1.5px 0 #09112e,
                 1.5px -1.5px 0 #09112e,
                -1.5px  1.5px 0 #09112e,
                 1.5px  1.5px 0 #09112e,
                 0px    3px   0 #09112e;
        }

        /* Badge supérieur style cartoon */
        .cartoon-pill {
            background-color: #13286e;
            border: 3px solid #09112e;
            box-shadow: 0 4px 0 #09112e;
        }

        /* Barre de progression cartoon épaisse et saturée */
        .cartoon-progress-track {
            background-color: #0e1d52;
            border: 4px solid #09112e;
            box-shadow: 0 6px 0 #09112e;
            position: relative;
            overflow: hidden;
        }

        @keyframes candy-scroll {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .cartoon-progress-fill {
            background-color: #ff2a4b;
            background-image: repeating-linear-gradient(
                -45deg,
                #ff2a4b 0px,
                #ff2a4b 12px,
                #00e5ff 12px,
                #00e5ff 24px
            );
            background-size: 40px 40px;
            animation: candy-scroll 1.1s linear infinite;
            border-right: 4px solid #09112e;
            transition: width 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        /* Reflet blanc brillant style dessin animé sur le haut de la barre */
        .cartoon-progress-fill::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 6px;
            right: 6px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
        }

        /* Flottement doux du logo */
        @keyframes logo-bob {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }

        .animate-logo-cartoon {
            animation: logo-bob 3.4s ease-in-out infinite;
        }

        /* Fumée cartoon animée au-dessus des cheminées */
        @keyframes puff-rise {
            0% { transform: translateY(0) scale(0.7); opacity: 0.95; }
            100% { transform: translateY(-34px) scale(1.35); opacity: 0; }
        }

        .smoke-1 { animation: puff-rise 2.8s ease-out infinite; }
        .smoke-2 { animation: puff-rise 2.8s ease-out 1.4s infinite; }
    </style>
</head>

    <!-- SCRIPTS : Fonctions natives Garry's Mod + Simulation navigateur + Neige Canvas -->
    <script>
        // ==========================================
        // 1. ÉTAT DU CHARGEMENT & RÉFÉRENCES UI
        // ==========================================
        const state = {
            totalFiles: 0,
            neededFiles: 0,
            isGMod: false,
            simulationTimer: null
        };

        const ui = {
            status: document.getElementById('status-text'),
            file: document.getElementById('file-text'),
            percent: document.getElementById('progress-percent'),
            bar: document.getElementById('progress-bar'),
            count: document.getElementById('files-count'),
            map: document.getElementById('server-map'),
            gamemode: document.getElementById('server-gamemode')
        };

        const backgroundMusic = document.getElementById('background-music');
        const musicToggle = document.getElementById('music-toggle');
        backgroundMusic.volume = 0.08;
        const musicPlayback = backgroundMusic.play();
        if (musicPlayback && typeof musicPlayback.catch === 'function') {
            musicPlayback.catch(() => {
                musicToggle.style.display = 'flex';
            });
        }

        musicToggle.addEventListener('click', () => {
            const playback = backgroundMusic.play();
            if (playback && typeof playback.then === 'function') {
                playback.then(() => {
                    musicToggle.style.display = 'none';
                }).catch(() => {
                    musicToggle.textContent = 'Musique indisponible';
                });
            } else {
                musicToggle.style.display = 'none';
            }
        });

        function setProgress(pct) {
            const safePct = Math.max(0, Math.min(100, Math.round(pct)));
            ui.bar.style.width = safePct + '%';
            ui.percent.textContent = safePct + '%';
        }

        function stopPreviewSimulation() {
            if (state.simulationTimer) {
                clearInterval(state.simulationTimer);
                state.simulationTimer = null;
            }
        }

        function refreshCounters() {
            if (state.totalFiles > 0) {
                const downloaded = Math.max(0, state.totalFiles - state.neededFiles);
                ui.count.textContent = `${downloaded} / ${state.totalFiles} fichiers`;
                setProgress((downloaded / state.totalFiles) * 100);
            } else {
                ui.count.textContent = "Prêt";
            }
        }

        // ==========================================
        // 2. HOOKS NATIFS GARRY'S MOD (sv_loadingurl)
        // ==========================================
        window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            state.isGMod = true;
            stopPreviewSimulation();

            if (mapname) ui.map.textContent = mapname;
            if (gamemode) ui.gamemode.textContent = gamemode;
        };

        window.SetStatusChanged = function(status) {
            state.isGMod = true;
            stopPreviewSimulation();

            const statusTranslations = {
                "Retrieving server info...": "Récupération des infos du serveur...",
                "Getting addon info for": "Vérification des addons Workshop...",
                "Mounting Addons": "Montage des addons en cours...",
                "Workshop Complete": "Addons Workshop terminés !",
                "Sending client info...": "Envoi des informations client...",
                "Starting Lua...": "Démarrage des scripts Lua..."
            };

            let translated = status;
            for (const [en, fr] of Object.entries(statusTranslations)) {
                if (status.includes(en)) {
                    translated = fr;
                    break;
                }
            }

            ui.status.textContent = translated;

            if (status.includes("Sending client info")) {
                setProgress(92);
            } else if (status.includes("Starting Lua")) {
                setProgress(100);
                ui.file.textContent = "Entrée sur Mystic Roleplay...";
            }
        };

        window.SetFilesTotal = function(total) {
            state.isGMod = true;
            stopPreviewSimulation();
            state.totalFiles = parseInt(total, 10) || 0;
            refreshCounters();
        };

        window.SetFilesNeeded = function(needed) {
            state.isGMod = true;
            stopPreviewSimulation();
            state.neededFiles = parseInt(needed, 10) || 0;
            refreshCounters();
        };

        window.DownloadingFile = function(fileName) {
            state.isGMod = true;
            stopPreviewSimulation();

            ui.status.textContent = "Téléchargement des addons...";
            ui.file.textContent = fileName;
            refreshCounters();
        };

        // ==========================================
        // 3. SIMULATION FLUIDE EN NAVIGATEUR CLASSIQUE
        // ==========================================
        function startPreviewSimulation() {
            const isGModClient = /GMod|Awesomium|Valve/i.test(navigator.userAgent);
            if (isGModClient || state.isGMod) return;

            const sampleAddons = [
                "addons/mystic_core/lua/autorun/sh_mystic.lua",
                "materials/mystic/logo/crescent_xmas.vtf",
                "models/mystic/props/christmas_tree.mdl",
                "sound/mystic/noel/jingle_bells.wav",
                "addons/mystic_hud/lua/vgui/cl_hud.lua",
                "materials/models/mystic/vehicles/santa_truck.vmt",
                "addons/mystic_jobs/lua/config/sh_metiers.lua",
                "maps/rp_rockford_v2b.bsp"
            ];

            const total = 40;
            let current = 0;

            ui.status.textContent = "Téléchargement des addons...";
            ui.count.textContent = `0 / ${total} fichiers`;

            state.simulationTimer = setInterval(() => {
                if (state.isGMod) {
                    stopPreviewSimulation();
                    return;
                }

                current++;
                if (current <= total) {
                    ui.file.textContent = sampleAddons[current % sampleAddons.length];
                    ui.count.textContent = `${current} / ${total} fichiers`;
                    setProgress((current / total) * 100);

                    if (current === total) {
                        ui.status.textContent = "Démarrage des scripts Lua...";
                        ui.file.textContent = "Bienvenue sur Mystic Roleplay !";
                    }
                } else if (current > total + 8) {
                    current = 0;
                    ui.status.textContent = "Téléchargement des addons...";
                    setProgress(0);
                }
            }, 240);
        }

        // ==========================================
        // 4. NEIGE CARTOON NETTE SUR HTML5 CANVAS
        // ==========================================
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];

        function resizeSnowCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initSnowflakes() {
            const count = Math.min(130, Math.floor((window.innerWidth * window.innerHeight) / 13000));
            flakes = [];

            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 2.5 + Math.random() * 3.8,
                    speedY: 1.0 + Math.random() * 1.8,
                    speedX: -0.3 + Math.random() * 0.6,
                    phase: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.015 + Math.random() * 0.02
                });
            }
        }

        function drawSnowflakes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < flakes.length; i++) {
                const f = flakes[i];
                f.phase += f.wobbleSpeed;
                f.y += f.speedY;
                f.x += f.speedX + Math.sin(f.phase) * 0.55;

                if (f.y > canvas.height + 10) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
                if (f.x > canvas.width + 10) f.x = -10;
                if (f.x < -10) f.x = canvas.width + 10;

                // Flocon blanc net avec léger contour sombre cartoon pour les plus gros
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                if (f.radius > 4.2) {
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = 'rgba(9, 17, 46, 0.55)';
                    ctx.stroke();
                }
            }

            requestAnimationFrame(drawSnowflakes);
        }

        window.addEventListener('resize', () => {
            resizeSnowCanvas();
            initSnowflakes();
        });

        window.onload = function() {
            resizeSnowCanvas();
            initSnowflakes();
            drawSnowflakes();

            setTimeout(() => {
                if (!state.isGMod) {
                    startPreviewSimulation();
                }
            }, 1200);
        };
    </script>
</body>
</html>
